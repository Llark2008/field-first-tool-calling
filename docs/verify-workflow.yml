name: Verify research artifacts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-cpu.txt
      - run: python -B -m fieldfirst.tests
      - run: python -B -m fieldfirst.verify
